name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate release identity
        run: node scripts/release-gate.mjs --validate
      - name: Stamp manifest fingerprint from the packed file set
        run: node scripts/stamp-manifest.mjs
        env:
          ORGX_MANIFEST_SIGNING_KEY: ${{ secrets.ORGX_MANIFEST_SIGNING_KEY }}
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-release-tarball
          path: artifacts/*.tgz
          if-no-files-found: error

  release:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check immutable release identity
        id: release
        run: node scripts/release-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install trusted publishing npm
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@11.18.0

      - name: Download validated package
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-release-tarball
          path: artifacts

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: npm publish ./artifacts/*.tgz --access public --provenance --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}

      - name: Verify registry version
        if: steps.release.outputs.publish == 'true'
        run: |
          for _ in {1..60}; do
            actual="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || true)"
            test "$actual" = "$PACKAGE_VERSION" && exit 0
            sleep 5
          done
          exit 1
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}

      - name: Upload Artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarball
          path: artifacts/*.tgz

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        # Create only: a concurrent release fails instead of editing notes/assets.
        run: gh release create "$RELEASE_TAG" ./artifacts/*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
