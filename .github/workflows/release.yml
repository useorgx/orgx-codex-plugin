name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted publishing npm
        run: npm install --global npm@11.18.0

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Pack
        run: mkdir -p artifacts && npm pack --pack-destination artifacts

      - name: Resolve release metadata
        id: release
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('plugin.manifest.json', 'utf8'));
          const plugin = JSON.parse(readFileSync('.codex-plugin/plugin.json', 'utf8'));
          if (pkg.version !== manifest.version || pkg.version !== plugin.version) {
            throw new Error(`release versions disagree: package=${pkg.version}, manifest=${manifest.version}, plugin=${plugin.version}`);
          }
          if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package v${pkg.version}`);
          }
          console.log(`name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          console.log(`tag=${pkg.version.includes('-') ? 'alpha' : 'latest'}`);
          NODE

      - name: Check registry
        id: registry
        run: |
          if npm view "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish ./artifacts/*.tgz --access public --tag "${{ steps.release.outputs.tag }}"

      - name: Verify registry version
        run: |
          for _ in {1..12}; do
            actual="$(npm view "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}" version 2>/dev/null || true)"
            test "$actual" = "${{ steps.release.outputs.version }}" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: artifacts/*.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
